<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rock MIDI Player</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif; margin:0;
         display:flex; flex-direction:column; align-items:center; gap:16px; padding:32px 16px; }
  #drop { border:2px dashed #555; border-radius:12px; padding:40px; width:min(520px,100%);
          box-sizing:border-box; text-align:center; cursor:pointer; }
  #drop.over { border-color:#e74c3c; background:#1c1c1c; }
  button { font-size:18px; padding:10px 28px; border:0; border-radius:8px;
           background:#c0392b; color:#fff; cursor:pointer; }
  button:disabled { background:#555; cursor:default; }
  #tracks { width:min(520px,100%); font-size:14px; }
  #tracks div { display:flex; justify-content:space-between; padding:4px 0; border-bottom:1px solid #222; }
  progress { width:min(520px,100%); }
  label { display:flex; gap:10px; align-items:center; }
  #status { opacity:.7; }
</style>
</head>
<body>
<h1>Rock MIDI Player 🤘</h1>
<div id="drop">MIDI dosyasını buraya sürükle ya da tıkla<input id="file" type="file" accept=".mid,.midi" hidden></div>
<div>
  <button id="play" disabled>▶ Çal</button>
  <button id="stop" disabled>■ Durdur</button>
</div>
<progress id="prog" value="0" max="1"></progress>
<label>Gain <input id="gain" type="range" min="0" max="1" step="0.01" value="0.9"></label>
<div id="status">Sample'lar indiriliyor…</div>
<div id="tracks"></div>

<script>
const GTR = "https://nbrosowsky.github.io/tonejs-instruments/samples/guitar-electric/";
const BASS = "https://nbrosowsky.github.io/tonejs-instruments/samples/bass-electric/";
const DRUMS = "https://tonejs.github.io/audio/drum-samples/acoustic-kit/";
const GTR_URLS = {
  "C#2": "Cs2.mp3", E2: "E2.mp3", "F#2": "Fs2.mp3", A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3",
  "F#3": "Fs3.mp3", A3: "A3.mp3", C4: "C4.mp3", "D#4": "Ds4.mp3", "F#4": "Fs4.mp3", A4: "A4.mp3",
  C5: "C5.mp3", "D#5": "Ds5.mp3", "F#5": "Fs5.mp3", A5: "A5.mp3", C6: "C6.mp3",
};
const BASS_URLS = {
  "C#1": "Cs1.mp3", E1: "E1.mp3", G1: "G1.mp3", "A#1": "As1.mp3", "C#2": "Cs2.mp3", E2: "E2.mp3",
  G2: "G2.mp3", "A#2": "As2.mp3", "C#3": "Cs3.mp3", E3: "E3.mp3", G3: "G3.mp3", "A#3": "As3.mp3",
};

// ---------- Master ----------
const limiter = new Tone.Limiter(-1).toDestination();
const masterComp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).connect(limiter);
const master = new Tone.Gain(0.8).connect(masterComp);
const room = new Tone.Reverb({ decay: 1.5, wet: 1 });
const roomSend = new Tone.Gain(0.15).connect(room);
room.connect(master);

// ---------- Enstrüman rig'leri ----------
function distRig(pan) {
  const panner = new Tone.Panner(pan).connect(master);
  const cab = new Tone.Filter({ frequency: 5200, type: "lowpass", rolloff: -24 }).connect(panner);
  const presence = new Tone.Filter({ frequency: 2500, type: "peaking", Q: 1, gain: 3 }).connect(cab);
  const eq = new Tone.EQ3({ low: 3, mid: -6, high: 2, lowFrequency: 250, highFrequency: 2000 }).connect(presence);
  const post = new Tone.Filter(80, "highpass").connect(eq);
  const dist = new Tone.Distortion({ distortion: 0.9, oversample: "4x" }).connect(post);
  const tight = new Tone.Filter(180, "highpass").connect(dist);
  const pre = new Tone.Gain(4).connect(tight);
  const s = new Tone.Sampler({ urls: GTR_URLS, baseUrl: GTR, release: 0.15 }).connect(pre);
  s.volume.value = -12;
  return { play: (n, d, t, v) => s.triggerAttackRelease(n, d, t, v), dist, stop: () => s.releaseAll() };
}
function cleanRig(pan) {
  const panner = new Tone.Panner(pan).connect(master);
  panner.connect(roomSend);
  const chorus = new Tone.Chorus(2, 3, 0.4).connect(panner).start();
  const comp = new Tone.Compressor(-20, 3).connect(chorus);
  const s = new Tone.Sampler({ urls: GTR_URLS, baseUrl: GTR, release: 0.6 }).connect(comp);
  s.volume.value = -6;
  return { play: (n, d, t, v) => s.triggerAttackRelease(n, d, t, v), stop: () => s.releaseAll() };
}
function bassRig() {
  const comp = new Tone.Compressor({ threshold: -20, ratio: 4 }).connect(master);
  const lp = new Tone.Filter(1800, "lowpass").connect(comp);
  const drive = new Tone.Distortion({ distortion: 0.3, wet: 0.4 }).connect(lp);
  const s = new Tone.Sampler({ urls: BASS_URLS, baseUrl: BASS, release: 0.1 }).connect(drive);
  s.volume.value = -4;
  return { play: (n, d, t, v) => s.triggerAttackRelease(n, d, t, v), stop: () => s.releaseAll() };
}
function synthRig(pan) {
  const panner = new Tone.Panner(pan).connect(master);
  panner.connect(roomSend);
  const s = new Tone.PolySynth(Tone.Synth, {
    oscillator: { type: "triangle" }, envelope: { attack: 0.02, release: 0.4 },
  }).connect(panner);
  s.volume.value = -16;
  return { play: (n, d, t, v) => s.triggerAttackRelease(n, d, t, v), stop: () => s.releaseAll() };
}

// Davul: GM perküsyon haritası
const drumBus = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.005, release: 0.1 });
drumBus.connect(master);
drumBus.connect(roomSend);
const kit = new Tone.Players({
  kick: DRUMS + "kick.mp3", snare: DRUMS + "snare.mp3", hihat: DRUMS + "hihat.mp3",
  tom1: DRUMS + "tom1.mp3", tom2: DRUMS + "tom2.mp3", tom3: DRUMS + "tom3.mp3",
}).connect(drumBus);
kit.player("hihat").volume.value = -8;
const cymbal = new Tone.MetalSynth({
  envelope: { attack: 0.001, decay: 1.2, release: 0.5 },
  harmonicity: 5.1, modulationIndex: 40, resonance: 5000, octaves: 1.5,
}).connect(drumBus);
cymbal.volume.value = -22;
const DRUM_MAP = {
  35: "kick", 36: "kick", 37: "snare", 38: "snare", 39: "snare", 40: "snare",
  42: "hihat", 44: "hihat", 46: "hihat",
  41: "tom3", 43: "tom3", 45: "tom2", 47: "tom2", 48: "tom1", 50: "tom1",
};
const drumRig = {
  play(midi, t, v) {
    const name = DRUM_MAP[midi];
    if (name) {
      const p = kit.player(name);
      p.volume.setValueAtTime(Tone.gainToDb(v) + (name === "hihat" ? -8 : 0), t);
      p.start(t);
    } else if ([49, 51, 52, 53, 55, 57, 59].includes(midi)) {
      const ride = midi === 51 || midi === 59 || midi === 53;
      cymbal.triggerAttackRelease(ride ? "C6" : "A5", ride ? "16n" : "2n", t, v);
    }
  },
  stop() {},
};

// ---------- MIDI yükleme ----------
let parts = [], rigs = [], duration = 0;
const $ = (id) => document.getElementById(id);
const status = $("status");

function kindOf(track) {
  if (track.instrument.percussion || track.channel === 9) return "drums";
  const p = track.instrument.number;
  if (p >= 29 && p <= 31) return "dist";
  if (p >= 24 && p <= 28) return "clean";
  if (p >= 32 && p <= 39) return "bass";
  return "other";
}

function clearSong() {
  Tone.Transport.stop();
  Tone.Transport.cancel();
  parts.forEach((p) => p.dispose());
  rigs.forEach((r) => r.stop());
  parts = [];
}

// Rig'ler parça yüklenmeden önce hazır: sample indirme bir kez yapılır
const pool = {
  dist: [distRig(-0.8), distRig(0.8), distRig(-0.4), distRig(0.4)],
  clean: [cleanRig(-0.3), cleanRig(0.3)],
  bass: [bassRig()],
  other: [synthRig(-0.2), synthRig(0.2)],
};
rigs = [...pool.dist, ...pool.clean, ...pool.bass, ...pool.other];

async function loadMidi(file) {
  clearSong();
  const data = new Midi(await file.arrayBuffer());
  duration = data.duration;
  if (data.header.tempos.length) Tone.Transport.bpm.value = data.header.tempos[0].bpm;

  const used = { dist: 0, clean: 0, bass: 0, other: 0 };
  const list = $("tracks");
  list.innerHTML = "";
  const distTracks = data.tracks.filter((t) => t.notes.length && kindOf(t) === "dist").length;

  data.tracks.forEach((track) => {
    if (!track.notes.length) return;
    const kind = kindOf(track);
    let play;
    if (kind === "drums") {
      play = (time, n) => drumRig.play(n.midi, time, n.velocity);
    } else {
      const bank = pool[kind];
      if (kind === "dist" && distTracks === 1) {
        // Tek distorsiyonlu gitar kanalı: sol ve sağa çift kayıt (double-tracking)
        const [L, R] = bank;
        play = (time, n) => {
          L.play(n.name, n.duration, time + Math.random() * 0.008, n.velocity);
          R.play(n.name, n.duration, time + 0.006 + Math.random() * 0.008, n.velocity * 0.97);
        };
      } else {
        const rig = bank[used[kind]++ % bank.length];
        play = (time, n) => rig.play(n.name, n.duration, time, n.velocity);
      }
    }
    const part = new Tone.Part(play, track.notes.map((n) => ({
      time: n.time, name: n.name, midi: n.midi, duration: n.duration, velocity: n.velocity,
    }))).start(0);
    parts.push(part);

    const row = document.createElement("div");
    row.innerHTML = `<span>${track.name || track.instrument.name}</span><span>${kind} · ${track.notes.length} nota</span>`;
    list.appendChild(row);
  });

  $("play").disabled = false;
  $("stop").disabled = false;
  status.textContent = `${file.name} yüklendi · ${Math.round(duration)} sn`;
}

// ---------- UI ----------
const drop = $("drop"), fileInput = $("file");
drop.onclick = () => fileInput.click();
fileInput.onchange = () => fileInput.files[0] && loadMidi(fileInput.files[0]);
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add("over"); };
drop.ondragleave = () => drop.classList.remove("over");
drop.ondrop = (e) => {
  e.preventDefault(); drop.classList.remove("over");
  const f = e.dataTransfer.files[0];
  if (f) loadMidi(f);
};

$("play").onclick = async () => {
  await Tone.start();
  if (Tone.Transport.state === "started") {
    Tone.Transport.pause();
    rigs.forEach((r) => r.stop());
    $("play").textContent = "▶ Çal";
  } else {
    Tone.Transport.start("+0.1");
    $("play").textContent = "❚❚ Duraklat";
  }
};
$("stop").onclick = () => {
  Tone.Transport.stop();
  rigs.forEach((r) => r.stop());
  $("play").textContent = "▶ Çal";
};
$("gain").oninput = (e) => {
  const v = parseFloat(e.target.value);
  pool.dist.forEach((r) => (r.dist.distortion = v));
};
setInterval(() => {
  $("prog").value = duration ? Tone.Transport.seconds / duration : 0;
  if (duration && Tone.Transport.seconds > duration + 1) $("stop").onclick();
}, 200);

Tone.loaded()
  .then(() => (status.textContent = "Hazır — bir MIDI dosyası yükle"))
  .catch((e) => (status.textContent = "Sample'lar yüklenemedi: " + e.message));
</script>
</body>
</html>
