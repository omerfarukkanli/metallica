<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enter Sandman – Tone.js</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
<style>
  body { background:#111; color:#eee; font-family:system-ui,sans-serif;
         display:flex; flex-direction:column; align-items:center; justify-content:center;
         min-height:100vh; margin:0; gap:16px; padding:0 16px; }
  button { font-size:20px; padding:12px 32px; border:0; border-radius:8px;
           background:#c0392b; color:#fff; cursor:pointer; }
  button:hover { background:#e74c3c; }
  button:disabled { background:#555; cursor:wait; }
  #status { opacity:.7; }
  label { display:flex; gap:10px; align-items:center; }
</style>
</head>
<body>
<h1>Enter Sandman 🎸</h1>
<button id="play" disabled>Yükleniyor…</button>
<label>Gain <input id="gain" type="range" min="0" max="1" step="0.01" value="0.9"></label>
<div id="status">Sample'lar indiriliyor…</div>

<script>
const BPM = 123;
const GTR = "https://nbrosowsky.github.io/tonejs-instruments/samples/guitar-electric/";
const BASS = "https://nbrosowsky.github.io/tonejs-instruments/samples/bass-electric/";
const DRUMS = "https://tonejs.github.io/audio/drum-samples/acoustic-kit/";

// ---------- Master bus ----------
const limiter = new Tone.Limiter(-1).toDestination();
const masterComp = new Tone.Compressor({ threshold: -18, ratio: 3, attack: 0.01, release: 0.2 }).connect(limiter);
const master = new Tone.Gain(0.9).connect(masterComp);
const room = new Tone.Reverb({ decay: 1.4, wet: 0.18 }).connect(master);

// ---------- Gitar: gerçek elektro gitar sample'ı -> amfi zinciri ----------
// Sample -> tighten (HPF) -> yüksek gain distorsiyon -> "scooped" EQ -> kabin (LPF) -> pan
function makeGuitarRig(pan, drive) {
  const panner = new Tone.Panner(pan).connect(master);
  const cab = new Tone.Filter({ frequency: 5200, type: "lowpass", rolloff: -24 }).connect(panner);
  const presence = new Tone.Filter({ frequency: 2500, type: "peaking", Q: 1, gain: 3 }).connect(cab);
  const eq = new Tone.EQ3({ low: 3, mid: -6, high: 2, lowFrequency: 250, highFrequency: 2000 }).connect(presence);
  const post = new Tone.Filter({ frequency: 80, type: "highpass" }).connect(eq);
  const dist = new Tone.Distortion({ distortion: drive, oversample: "4x" }).connect(post);
  const tight = new Tone.Filter({ frequency: 180, type: "highpass" }).connect(dist);
  const preGain = new Tone.Gain(4).connect(tight);
  const sampler = new Tone.Sampler({
    urls: { E2: "E2.mp3", "F#2": "Fs2.mp3", A2: "A2.mp3", C3: "C3.mp3", "D#3": "Ds3.mp3", A3: "A3.mp3", C4: "C4.mp3" },
    baseUrl: GTR, release: 0.15,
  }).connect(preGain);
  sampler.volume.value = -10;
  return { sampler, dist };
}

const gtrL = makeGuitarRig(-0.8, 0.9);
const gtrR = makeGuitarRig(0.8, 0.85);

const bassComp = new Tone.Compressor({ threshold: -20, ratio: 4 }).connect(master);
const bassLP = new Tone.Filter(1800, "lowpass").connect(bassComp);
const bassDrive = new Tone.Distortion({ distortion: 0.3, wet: 0.4 }).connect(bassLP);
const bass = new Tone.Sampler({
  urls: { E1: "E1.mp3", G1: "G1.mp3", "A#1": "As1.mp3", "C#2": "Cs2.mp3", E2: "E2.mp3" },
  baseUrl: BASS, release: 0.1,
}).connect(bassDrive);
bass.volume.value = -4;

const drumBus = new Tone.Compressor({ threshold: -16, ratio: 4, attack: 0.005, release: 0.1 });
drumBus.connect(master);
drumBus.connect(room);
const drums = new Tone.Players({
  kick: DRUMS + "kick.mp3", snare: DRUMS + "snare.mp3", hihat: DRUMS + "hihat.mp3",
}).connect(drumBus);
drums.player("kick").volume.value = 2;
drums.player("snare").volume.value = 0;
drums.player("hihat").volume.value = -10;

const PC = (root) => { 
  const r = Tone.Frequency(root);
  return [root, r.transpose(7).toNote(), r.transpose(12).toNote()];
};
const riff = [
  ["0:0:0", ["E2"], "8n", 1.0],
  ["0:0:2", ["B2"], "8n", 0.9],
  ["0:1:0", ["E3"], "8n", 0.9],
  ["0:1:2", ["A#2"], "4n.", 0.95],
  ["0:3:0", ["E2"], "16n", 0.7, true],
  ["0:3:1", ["E2"], "16n", 0.6, true],
  ["0:3:2", ["E2"], "16n", 0.75, true],
  ["0:3:3", ["E2"], "16n", 0.6, true],

  ["1:0:0", ["E2"], "8n", 1.0],
  ["1:0:2", ["B2"], "8n", 0.9],
  ["1:1:0", ["E3"], "8n", 0.9],
  ["1:1:2", ["A#2"], "8n", 0.95],
  ["1:2:0", ["E2"], "16n", 0.7, true],
  ["1:2:1", ["E2"], "16n", 0.6, true],
  ["1:2:2", PC("A#2"), "8n", 1.0],
  ["1:3:0", PC("A2"), "4n", 1.0],
];

// Palm mute: çok kısa nota + düşük velocity
function playGuitar(rig, notes, dur, time, vel, pm) {
  const d = pm ? 0.07 : dur;
  rig.sampler.triggerAttackRelease(notes, d, time, pm ? vel * 0.8 : vel);
}

const guitarPart = new Tone.Part((time, [notes, dur, vel = 1, pm = false]) => {
  // İki gitar aynı riffi birkaç ms farkla çalar -> kalın, geniş ses
  playGuitar(gtrL, notes, dur, time + Math.random() * 0.008, vel, pm);
  playGuitar(gtrR, notes, dur, time + 0.006 + Math.random() * 0.008, vel * 0.97, pm);
}, riff.map(([t, ...rest]) => [t, rest]));
guitarPart.loop = true;
guitarPart.loopEnd = "2m";

// Bas: her notanın kökünü bir oktav aşağıdan takip eder
const bassPart = new Tone.Part((time, [notes, dur, vel = 1, pm = false]) => {
  const root = Tone.Frequency(notes[0]).transpose(-12).toNote();
  bass.triggerAttackRelease(root, pm ? 0.1 : dur, time, vel);
}, riff.map(([t, ...rest]) => [t, rest]));
bassPart.loop = true;
bassPart.loopEnd = "2m";

// Davul: 16'lık adımlar, 1 ölçü
const K = [0, 6, 8, 10];  // kick
const S = [4, 12];        // snare
const drumSeq = new Tone.Sequence((time, step) => {
  const h = (n) => n * (0.9 + Math.random() * 0.2); // humanize
  if (step % 2 === 0) drums.player("hihat").start(time, 0, undefined);
  if (K.includes(step)) drums.player("kick").start(time);
  if (S.includes(step)) drums.player("snare").start(time + h(0.004));
}, [...Array(16).keys()], "16n");
drumSeq.loop = true;

// ---------- Kontroller ----------
const btn = document.getElementById("play");
const status = document.getElementById("status");
const gainSlider = document.getElementById("gain");
let playing = false;

gainSlider.addEventListener("input", (e) => {
  const v = parseFloat(e.target.value);
  gtrL.dist.distortion = v;
  gtrR.dist.distortion = Math.max(0, v - 0.05);
});

Tone.loaded().then(() => {
  btn.disabled = false;
  btn.textContent = "▶ Çal";
  status.textContent = "Hazır";
}).catch((e) => {
  status.textContent = "Sample'lar yüklenemedi: " + e.message;
});

btn.addEventListener("click", async () => {
  await Tone.start();
  if (!playing) {
    Tone.Transport.bpm.value = BPM;
    Tone.Transport.position = 0;
    guitarPart.start(0);   // 2 ölçü tek gitar
    bassPart.start("2m");  // sonra bas
    drumSeq.start("4m");   // sonra full band
    Tone.Transport.start("+0.1");
    btn.textContent = "■ Durdur";
    status.textContent = `Çalıyor… ${BPM} BPM`;
  } else {
    Tone.Transport.stop();
    guitarPart.stop(); bassPart.stop(); drumSeq.stop();
    gtrL.sampler.releaseAll(); gtrR.sampler.releaseAll(); bass.releaseAll();
    btn.textContent = "▶ Çal";
    status.textContent = "Durdu";
  }
  playing = !playing;
});
</script>
</body>
</html>
